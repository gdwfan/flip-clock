name: CI

# 只跑「不依赖真硬件」的门禁；三套必须在真机上跑的写在文件末尾。
# 【临时诊断模式】当前版本会把每个探针的完整输出推到 ci-log 分支，便于在无凭证环境下定位云端失败。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # 仅诊断期需要（推 ci-log 分支）

jobs:
  probes:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 psutil pillow

      - name: 环境自述（排查用）
        shell: pwsh
        run: |
          python -X utf8 -c "import sys, PySide6; print('python', sys.version); print('PySide6', PySide6.__version__)"
          Get-CimInstance Win32_VideoController | Select-Object -First 1 Name, CurrentHorizontalResolution, CurrentVerticalResolution
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::AllScreens | ForEach-Object { "screen: $($_.Bounds)" }
          python -X utf8 -c "import PySide6.QtGui as g; from PySide6.QtWidgets import QApplication; a=QApplication([]); print('platform:', a.platformName()); print('screen:', a.primaryScreen().geometry(), 'dpr:', a.primaryScreen().devicePixelRatio()); print('ArialBlack:', g.QFontInfo(g.QFont('Arial Black')).family())"

      - name: 逐个跑探针并收集输出
        id: all
        continue-on-error: true
        shell: pwsh
        run: |
          $probes = @(
            @{n='test_logic';   f='_probe/test_logic.py'},
            @{n='geom_check';   f='_probe/geom_check.py'},
            @{n='toggle_check'; f='_probe/toggle_check.py'},
            @{n='defects';      f='_probe/defects_check.py'},
            @{n='panel_fit';    f='_probe/panel_fit.py'},
            @{n='bright_cost';  f='_probe/bright_cost.py'},
            @{n='mem_check';    f='_probe/mem_check.py'}
          )
          $log = New-Object System.Collections.Generic.List[string]
          $fail = 0
          foreach ($p in $probes) {
            $out  = & python -X utf8 -I $p.f 2>&1 | Out-String
            $code = $LASTEXITCODE
            $log.Add("===== $($p.n)  exit=$code =====")
            $log.Add($out.TrimEnd())
            if ($code -ne 0) { $fail++ }
          }
          $log.Add("===== failed_probes=$fail =====")
          $log -join "`n" | Set-Content -Path ci-probe-log.txt -Encoding utf8
          if ($fail -gt 0) { exit 1 }

      - name: 失败时把日志推到 ci-log 分支（诊断期专用）
        if: steps.all.outcome != 'success'
        shell: pwsh
        run: |
          git config user.name ci-bot
          git config user.email ci-bot@users.noreply.github.com
          git checkout --orphan ci-log
          git add -f ci-probe-log.txt
          git commit -m "ci probe log ($env:GITHUB_SHA)"
          git push -f origin ci-log

# 不进 CI 的三套（本机必跑，CI 里必红或无法判定）：
#   _probe/backlight_check.py  断言本机 Power API 可调背光 —— CI runner 无 ACPI 亮度接口
#   _probe/smoke.py            含真背光场景（FLIPCLOCK_ALLOW_BRIGHT=1），无背光时该断言必红
#   _probe/bg_mode_check.py    断言「启动不抢前台焦点」——需要交互式桌面会话才有前台窗口可比
